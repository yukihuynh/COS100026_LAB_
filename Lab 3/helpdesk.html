<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Week 03 Lab Exercise">
    <meta name="keywords" content="CWA Help Desk Appointment">
    <meta name="author" content="Yuki Huynh Phan">
    <title>CWA Help Desk Appointment</title>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <form>
        <a href="https://www.swinburne.edu.au/" target="_blank">
            <img src="logo.png" alt="Swinburne Logo" width="200">
        </a>
        <h1>CWA Help Desk Appointment</h1>
        <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday </p>
        <P>Check Blackboard for when CWA tutors will be there.</P>
        <fieldset>
            <legend>Student details</legend>
            <P>
                <label for="StudentID">Student ID
                    <input type="text" name="student_id" id="StudentID" required pattern="\d{7,10}">
                </label>
            </P>
            <p>
                <label for="GivenName">
                    Given Name
                    <input type="text" name="given_name" id="GivenName" required pattern="[A-Za-z]+" maxlength="15">
                </label>
                <label for ="FamilyName">
                    Family Name
                    <input type="text" name="family_name" id="FamilyName" required pattern="[A-Za-z]+" maxlength="15">
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>
            <p>
            <label>   
                <input type="radio" name="unit" value="COS10011" id="COS10011" required>
                COS10011
            </label>
            <label>
                <input type="radio" name="unit" value="COS60004" id="COS60004">
                COS60004
            </label>
            <label>
                <input type="radio" name="unit" value="COS60007" id="COS60007">
                COS60007
            </label>
            </p>
            <p>
                <label for="tutor">Your tutor</label>
                <select name="tutor" id="tutor">
                    <option value="first tutor">Please select</option> 
                    <option value="tutor1">Wilson</option>
                    <option value="tutor2">Trung</option> 
                    <option value="tutor3">Doan</option>
                </select>
            </p>   
        </fieldset>

        
        <fieldset>
            <legend>Issue</legend>
            <p>
                <label for="HTML">
                    HTML 
                    <input type="checkbox" name="issue" value="HTML" id="HTML">
                </label>
                <label for="CSS">
                    CSS 
                    <input type="checkbox" name="issue" value="CSS" id="CSS">
                </label>
                <label for="JavaScript">
                    JavaScript
                    <input type="checkbox" name="issue" value="JavaScript" id="JavaScript">
                </label>
                <label for="PHP">
                    PHP
                    <input type="checkbox" name="issue" value="PHP" id="PHP">
                </label>
                <label for="MySQL">
                    MySQL
                    <input type="checkbox" name="issue" value="MySQL" id="MySQL">
                </label>
            </p>
            <p>Description of issue</p>
                <label for="description">
                    <textarea name="description" id="description" rows="5" cols="40" placeholder="Write description of your problem here..." required></textarea>
                </label>
        </fieldset>


        <fieldset>
            <legend>Preferred Date/Time</legend>
            <p>
                <label for="date">
                    Date
                    <input type="text" name="date" id="date" required placeholder="dd/mm/yyyy" pattern="(0[1-9] | [12] \d|3[01] ) \/(0[1-9]|1[0-2])\/\d{4}">
                </label>
            </p>
            <p>
                <label for="time">
                    Time
                    <input type="text" name="time" id="time" required placeholder="hh:mm" pattern="\d{2}:\d{2}">
                </label>
            </p>
        </fieldset>
        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    </form>
</body>
</html>
